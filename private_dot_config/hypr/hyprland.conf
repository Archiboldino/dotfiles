#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#


# See https://wiki.hyprland.org/Configuring/Monitors/
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/monitors.conf
monitor=,preferred,auto,auto

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
#exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = uwsm app -- guake
#exec-once = uwsm app -- swaync
exec-once = uwsm app -s b -- playerctld
exec-once = uwsm app -s b -- hypridle
exec-once = uwsm app -- Telegram
exec-once = sleep 20 && systemctl start --user gammastep.service
exec-once = hyprpm reload -n
exec-once = systemctl --user start hyprpolkitagent
exec-once = uwsm app -s b -- hypr_socket
exec-once = trash-empty 30 -f

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
# env = AQ_NO_MODIFIERS,1
#env = AQ_DRM_DEVICES,/dev/dri/card2
#env = AQ_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1
#env = XCURSOR_SIZE,24
#env = GUAKE_ENABLE_WAYLAND,1
# env = GDK_SCALE,2

xwayland {
  force_zero_scaling = true
}

cursor { 
  no_hardware_cursors = 2
}

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,ua
    kb_variant =
    kb_model =
    kb_options = caps:swapescape,grp:alt_shift_toggle

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }
    touchdevice {
        output = DP-1
    }

    sensitivity = -0.2 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    snap {
      enabled = true
    }
}

misc {
    disable_hyprland_logo = true
    new_window_takes_over_fullscreen = 1
    exit_window_retains_fullscreen = true
    middle_click_paste = false
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    enable_anr_dialog = false

    enable_swallow = true
    swallow_regex = .*kitty.*
}

binds {
    movefocus_cycles_fullscreen = false
    window_direction_monitor_fallback = true
}

render {
    direct_scanout = 2
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    #drop_shadow = yes
    #shadow_range = 4
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)
}

group {
  group_on_movetoworkspace = true
  col.border_active = rgba(33ccffee) rgba(00ff99ee) 45deg
  groupbar {
    render_titles = false
    height = 1
    col.active = rgba(33ccffee)
    col.inactive = rgba(595959aa)
    gaps_out = 0
    gaps_in = 0
  }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

#master {
    ## See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    #new_is_master = true
#}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = on
    workspace_swipe_touch = true
    workspace_swipe_invert = off
    workspace_swipe_distance = 150
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_direction_lock = false
    workspace_swipe_forever = true
    workspace_swipe_create_new = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device {
    name = logitech-mx-master-3000-1
    sensitivity = -0.5
}

plugin {
    dynamic-cursors {
      mode = none
      shake {

          # enables shake to find
          enabled = true

          # use nearest-neighbour (pixelated) scaling when shaking
          # may look weird when effects are enabled
          nearest = true

          # controls how soon a shake is detected
          # lower values mean sooner
          threshold = 4.0

          # magnification level immediately after shake start
          base = 4.0
          # magnification increase per second when continuing to shake
          speed = 5.0
          # how much the speed is influenced by the current shake intensitiy
          influence = 0.2

          # maximal magnification the cursor can reach
          # values below 1 disable the limit (e.g. 0)
          limit = 0.0

          # time in millseconds the cursor will stay magnified after a shake has ended
          timeout = 1000

          # show cursor behaviour `tilt`, `rotate`, etc. while shaking
          effects = false

          # enable ipc events for shake
          # see the `ipc` section below
          ipc = false
      }
    }
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center m+1 # [center/first] [workspace] e.g. first 1 or center m+1

        enable_gesture = true # laptop touchpad
        gesture_fingers = 3  # 3 or 4
        gesture_distance = 200 # how far is the "max"
        gesture_positive = false # positive = swipe down. Negative = swipe up.
    }
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more


$mainMod = SUPER

bind = $mainMod, R, exec, tofi-uwsm
bind = Alt, R, exec, $(tofi-run)
bind = $mainMod, Q, exec, uwsm-app -- firefox
bind = $mainMod, Return, exec, uwsm-app -- kitty
bind = $mainMod, T, exec, swaync-client -t
bind = $mainMod, W, killactive, 
bind = $mainMod, F11, exec, uwsm stop
bind = $mainMod, E, exec, uwsm-app -- dolphin
bind = $mainMod, V, togglefloating, 
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, S, togglesplit, # dwindle
bind = Control, Grave, exec, guake-toggle
bind = $mainMod, Print, exec, screenshot
bind = Control Shift $mainMod, L, exec, loginctl lock-session
bind = Control $mainMod, M, togglespecialworkspace
bind = $mainMod, N, movetoworkspace, special

# Move focus with mainMod + arrow keys
bind = $mainMod, U, focusurgentorlast
bind = $mainMod, L, movefocus, r
bind = $mainMod, H, movefocus, l
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = SUPER_SHIFT, L, movewindow, r
bind = SUPER_SHIFT, H, movewindow, l
bind = SUPER_SHIFT, K, movewindow, u
bind = SUPER_SHIFT, J, movewindow, d
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, Space, fullscreen, 1
bind = $mainMod, F, fullscreen, 0
binde = CONTROL $mainMod, L, resizeactive, 20 0
binde = CONTROL $mainMod, H, resizeactive, -20 0
binde = CONTROL $mainMod, K, resizeactive, 0 -20
binde = CONTROL $mainMod, J, resizeactive, 0 20

# Groups
bind = $mainMod, D, togglegroup
bind = $mainMod SHIFT, D, exec, hypr_tab
bind = $mainMod, Tab, exec, hyprctl dispatch changegroupactive | grep ok || hyprctl dispatch cyclenext
bind = Alt, Tab, exec, hyprctl dispatch cyclenext
bind = $mainMod SHIFT, W, moveoutofgroup
bind = SUPER CONTROL SHIFT, L, moveintogroup, r
bind = SUPER CONTROL SHIFT, H, moveintogroup, l
bind = SUPER CONTROL SHIFT, K, moveintogroup, u
bind = SUPER CONTROL SHIFT, J, moveintogroup, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, select_workspace select 1 || notify-send "$PATH"
bind = $mainMod, 2, exec, select_workspace select 2
bind = $mainMod, 3, exec, select_workspace select 3
bind = $mainMod, 4, exec, select_workspace select 4
bind = $mainMod, 5, exec, select_workspace select 5
bind = $mainMod, 6, exec, select_workspace select 6
bind = $mainMod, 7, exec, select_workspace select 7
bind = $mainMod, 8, exec, select_workspace select 8
bind = $mainMod, 9, exec, select_workspace select 9
bind = $mainMod, 0, exec, select_workspace select 10
bind = $mainMod, F1, exec, select_workspace select 6
bind = $mainMod, F2, exec, select_workspace select 7
bind = $mainMod, F3, exec, select_workspace select 8
bind = $mainMod, F4, exec, select_workspace select 9
bind = $mainMod, F5, exec, select_workspace select 10
# bind = $mainMod, 1, split-workspace, 1
# bind = $mainMod, 2, split-workspace, 2
# bind = $mainMod, 3, split-workspace, 3
# bind = $mainMod, 4, split-workspace, 4
# bind = $mainMod, 5, split-workspace, 5
# bind = $mainMod, 6, split-workspace, 6
# bind = $mainMod, 7, split-workspace, 7
# bind = $mainMod, 8, split-workspace, 8
# bind = $mainMod, 9, split-workspace, 9
# bind = $mainMod, 0, split-workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, exec, select_workspace move 1
bind = $mainMod SHIFT, 2, exec, select_workspace move 2
bind = $mainMod SHIFT, 3, exec, select_workspace move 3
bind = $mainMod SHIFT, 4, exec, select_workspace move 4
bind = $mainMod SHIFT, 5, exec, select_workspace move 5
bind = $mainMod SHIFT, 6, exec, select_workspace move 6
bind = $mainMod SHIFT, 7, exec, select_workspace move 7
bind = $mainMod SHIFT, 8, exec, select_workspace move 8
bind = $mainMod SHIFT, 9, exec, select_workspace move 9
bind = $mainMod SHIFT, 0, exec, select_workspace move 10
# bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
# bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
# bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3
# bind = $mainMod SHIFT, 4, split-movetoworkspacesilent, 4
# bind = $mainMod SHIFT, 5, split-movetoworkspacesilent, 5
# bind = $mainMod SHIFT, 6, split-movetoworkspacesilent, 6
# bind = $mainMod SHIFT, 7, split-movetoworkspacesilent, 7
# bind = $mainMod SHIFT, 8, split-movetoworkspacesilent, 8
# bind = $mainMod SHIFT, 9, split-movetoworkspacesilent, 9
# bind = $mainMod SHIFT, 0, split-movetoworkspacesilent, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, m-1
bind = $mainMod, mouse_up, workspace, m+1
# bind = $mainMod, mouse_down, split-cycleworkspaces, next
# bind = $mainMod, mouse_up, split-cycleworkspaces, prev
# bind = $mainMod, left, exec, next_workspace prev
# bind = $mainMod, right, exec, next_workspace next
bind = $mainMod, left, workspace, m-1
bind = $mainMod, right, workspace, m+1
bind = $mainMod, O, movewindow, mon:+1

binde = , XF86KbdBrightnessDown, exec, xbacklight -dec 10
binde = , XF86KbdBrightnessUp, exec, xbacklight -inc 10
bind = Control, XF86KbdBrightnessUp, exec, xbacklight -set 90
bind = Control, XF86KbdBrightnessDown, exec, xbacklight -set 0
bind = Alt, XF86KbdBrightnessUp, exec, ddcci_brightness +10
bind = Alt, XF86KbdBrightnessDown, exec, ddcci_brightness -10
bind = Control Alt, XF86KbdBrightnessUp, exec, ddcci_brightness -set 80
bind = Control Alt, XF86KbdBrightnessDown, exec, ddcci_brightness -set 10
bind = , XF86Launch3, exec, kb_brightness_toggle
bind = , XF86Launch4, exec, toggle_profile
bind = , XF86Launch1, exec, playerctl play-pause
bind = , XF86AudioPlay, exec, playerctl play-pause


# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
#bindl = , switch:Lid Switch, exec, playerctl -a pause

windowrule = float,class:^(org.telegram.desktop|telegramdesktop)$,title:^(Media viewer)$
windowrule = float, title:Property Browser — SolveSpace
windowrule = float, title:Event Tester

windowrule = float, class:guake
windowrule = animation slide, class:guake
windowrule = noborder, class:guake
windowrule = rounding 0, class:guake
windowrule = move 0 0, class:guake
windowrule = size 100% 400, class:guake

windowrule = workspace 5 silent, class:.*teams.*
windowrule = maximize, class:.*teams.*
windowrule = workspace 5 silent, class:.*telegram.*
windowrule = maximize, class:.*telegram.*

windowrule = float, class:.*pavucontrol.*
windowrule = float, class:.*blueman-manager.*
windowrule = float, class:.*iwgtk.*
windowrule = float, class:.*xfce4-power-manager-settings.*

# -- Fix odd behaviors in IntelliJ IDEs --
#! Fix focus issues when dialogs are opened or closed
# windowrule = windowdance,class:^(jetbrains-.*)$,floating:1
#! Fix splash screen showing in weird places and prevent annoying focus takeovers
windowrule = center,class:^(jetbrains-.*)$,title:^(splash)$,floating:1
windowrule = nofocus,class:^(jetbrains-.*)$,title:^(splash)$,floating:1
windowrule = noborder,class:^(jetbrains-.*)$,title:^(splash)$,floating:1

#! Center popups/find windows
windowrule= center,class:^(jetbrains-.*)$,title:^( )$,floating:1
windowrule= stayfocused,class:^(jetbrains-.*)$,title:^( )$,floating:1
windowrule= noborder,class:^(jetbrains-.*)$,title:^( )$,floating:1
#! Disable window flicker when autocomplete or tooltips appear
windowrule= nofocus,class:^(jetbrains-.*)$,title:^(win.*)$,floating:1


windowrule = forcergbx, title: (.*FreeCAD.*)

layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window

layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window

layerrule = ignorealpha 0.5, swaync-control-center
layerrule = ignorealpha 0.5, swaync-notification-window

# Smart gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = bordersize 0, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]

# noanim isn't necessary but animations with these rules might look bad. use at your own discretion.
windowrule = noanim, class:^(flameshot)$
windowrule = float, class:^(flameshot)$
windowrule = move 0 0, class:^(flameshot)$
windowrule = pin, class:^(flameshot)$
# set this to your leftmost monitor id, otherwise you have to move your cursor to the leftmost monitor
# before executing flameshot
windowrule = monitor 1, class:^(flameshot)$

# ctrl-c to copy from the flameshot gui gives warped images sometimes, but
# setting the env fixes it

